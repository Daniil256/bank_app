syntax = "proto3";

package customer.v1;

option go_package = "customer-service/proto/customer/v1;customerv1";

import "google/api/annotations.proto";

service CustomerService {
  rpc GetCustomer(GetCustomerRequest) returns (Customer) {
    option (google.api.http) = { get: "/v1/customers/{customer_id}" };
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (Customer) {
    option (google.api.http) = { patch: "/v1/customers/me" body: "*" };
  }
  rpc GetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse) {
    option (google.api.http) = { get: "/v1/customers/{customer_id}/status" };
  }
  rpc ListCustomers(ListCustomersRequest) returns (ListCustomersResponse) {
    option (google.api.http) = { get: "/v1/customers" };
  }
}

message Customer {
  string id          = 1;
  string user_id     = 2;
  string first_name  = 3;
  string last_name   = 4;
  string birth_date  = 5;  // YYYY-MM-DD
  string address     = 6;
  string phone       = 7;
  string citizenship = 8;
  string status      = 9;
  string created_at  = 10;
  string updated_at  = 11;
}

message GetCustomerRequest {
  string customer_id = 1;
}

message UpdateProfileRequest {
  string first_name  = 1;
  string last_name   = 2;
  string birth_date  = 3;
  string address     = 4;
  string phone       = 5;
  string citizenship = 6;
}

message GetCustomerStatusRequest {
  string customer_id = 1;
}

message GetCustomerStatusResponse {
  string customer_id = 1;
  string status      = 2;
}

message ListCustomersRequest {
  string status     = 1;
  string search     = 2;
  int32  page_size  = 3;
  string page_token = 4;
}

message ListCustomersResponse {
  repeated Customer customers       = 1;
  string            next_page_token = 2;
}