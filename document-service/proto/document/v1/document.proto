syntax = "proto3";

package document.v1;

option go_package = "document-service/proto/document/v1;documentv1";

import "google/api/annotations.proto";

service DocumentService {
  rpc InitUpload(InitUploadRequest) returns (InitUploadResponse) {
    option (google.api.http) = {
      post: "/v1/documents/init-upload"
      body: "*"
    };
  }
  rpc ConfirmUpload(ConfirmUploadRequest) returns (Document) {
    option (google.api.http) = {
      post: "/v1/documents/confirm"
      body: "*"
    };
  }
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse) {
    option (google.api.http) = { get: "/v1/documents/{document_id}/download" };
  }
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse) {
    option (google.api.http) = { get: "/v1/documents" };
  }
  rpc HasRequiredDocuments(HasRequiredDocumentsRequest) returns (HasRequiredDocumentsResponse) {
    // ❌ БЕЗ option (google.api.http) — внутренний метод
  }
}

message Document {
  string id           = 1;
  string customer_id  = 2;
  string doc_type     = 3;
  string status       = 4;
  int64  size_bytes   = 5;
  string mime_type    = 6;
  string sha256       = 7;
  string created_at   = 8;
  string confirmed_at = 9;
}

message InitUploadRequest {
  string doc_type = 1;  // PASSPORT, SELFIE, PROOF_OF_ADDRESS
}

message InitUploadResponse {
  string document_id = 1;
  string upload_url  = 2;  // presigned PUT
  string object_key  = 3;
}

message ConfirmUploadRequest {
  string document_id = 1;
}

message GetDownloadUrlRequest {
  string document_id = 1;
}

message GetDownloadUrlResponse {
  string download_url = 1;
  string expires_at   = 2;
}

message ListDocumentsRequest {
  string customer_id = 1;  // для OFFICER; CLIENT игнорирует
  string doc_type    = 2;  // фильтр (опционально)
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}
message HasRequiredDocumentsRequest {
  string customer_id = 1;
}

message HasRequiredDocumentsResponse {
  bool has_passport = 1;
  bool has_selfie   = 2;
}