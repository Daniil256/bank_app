syntax = "proto3";

package customer.v1;

option go_package = "kyc-service/proto/external/document/v1;documentv1";

import "google/api/annotations.proto";

service CustomerService {
  rpc SystemGetCustomerStatus(GetCustomerStatusRequest) returns (GetCustomerStatusResponse) {
    option (google.api.http) = { get: "/v1/system/customers/{user_id}/status" };
  }
  rpc SystemGetCustomer(GetCustomerRequest) returns (GetCustomerResponse) {
    option (google.api.http) = { get: "/v1/system/customers/{user_id}" };
  }
}

message GetCustomerStatusRequest {
  string user_id = 1;
}

message GetCustomerRequest {
  string user_id = 1;
}

message GetCustomerStatusResponse {
  string user_id = 1;
  string status  = 2;
}

message GetCustomerResponse {
  string user_id     = 1;
  string first_name  = 2;
  string last_name   = 3;
  string birth_date  = 4;
}

message Customer {
  string id          = 1;
  string user_id     = 2;
  string first_name  = 3;
  string last_name   = 4;
  string birth_date  = 5;  // YYYY-MM-DD
  string address     = 6;
  string phone       = 7;
  string citizenship = 8;
  string status      = 9;
  string created_at  = 10;
  string updated_at  = 11;
}